name: Nightly PostgreSQL Backup

on:
  schedule:
    # 17:30 UTC = 23:15 NPT — after business hours
    - cron: '30 17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump + encrypt (AES-256)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DUMP_PASSPHRASE: ${{ secrets.DUMP_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p dumps
          pg_dump --no-owner --no-privileges --dbname "$DATABASE_URL" -F custom \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -pass "env:DUMP_PASSPHRASE" \
            > "dumps/$(date +%Y-%m-%d).dump.enc"
          ls -lh dumps

      - name: Retention (30 days)
        run: find dumps -name '*.dump.enc' -mtime +30 -delete

      - name: Commit & push
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add dumps
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "backup: $(date +%Y-%m-%d)"
            git push
          fi
